name: Deploy App Bundle to Beta channel

on:
  push:
    branches: [ release ]
    paths-ignore:
      - '**/README.md'
      - '.github/**'

  workflow_dispatch:

permissions: write-all

jobs:
  build_aab:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Grant rights
        run: chmod +x build.gradle.kts

      - name: Copy google-services.json
        run: echo ${{ secrets.GOOGLE_JSON }} | base64 --decode > app/android/google-services.json

      - name: Copy key
        uses: RollyPeres/base64-to-path@v1
        with:
          filePath: ${{ github.workspace }}/app/android/keystore.jks
          encodedString: ${{ secrets.KEY_STORE }}

      - name: Console
        run: echo ${{ github.workspace }}/app/android/keystore.jks

      - name: Make secrets.properties
        run: echo ${{ secrets.SECRETS_PROPERTIES }} | base64 --decode > secrets.properties

      - name: "Check keystore existence"
        uses: andstor/file-existence-action@v3
        with:
          files: "app/android/keystore.jks"

      - name: Read version
        id: version
        run: |
          major=$(grep "^major=" config/versioning/android.properties | cut -d= -f2)
          minor=$(grep "^minor=" config/versioning/android.properties | cut -d= -f2)
          patch=$(grep "^patch=" config/versioning/android.properties | cut -d= -f2)
          VERSION_NAME="${major}.${minor}.${patch}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "TAG=android/v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Get previous Android tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep '^android/v' | head -n 1)
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        id: buildRelease
        run: ./gradlew clean app:android:bundleRelease

      - name: Upload *.aab artifact
        id: uploadArtifact
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: app/android/build/outputs/bundle/release/android-release.aab

      - name: Create service_account.json
        id: createServiceAccount
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Deploy to Play Store (BETA)
        id: deploy
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.egoriku.grodnoroads
          releaseFiles: app/android/build/outputs/bundle/release/android-release.aab
          tracks: beta
          mappingFile: app/android/build/outputs/mapping/release/mapping.txt
          status: completed

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Android ${{ steps.version.outputs.VERSION_NAME }}
          previous_tag: ${{ steps.prev_tag.outputs.PREV_TAG }}
          generate_release_notes: true
          files: app/android/build/outputs/bundle/release/android-release.aab

